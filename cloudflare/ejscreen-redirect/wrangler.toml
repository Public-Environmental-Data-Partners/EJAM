# Cloudflare Worker "ejscreen-redirect". Read ../README.md before deploying.
name = "ejscreen-redirect"
main = "src/index.mjs"
# The live Worker has no compatibility date set; Wrangler needs one. It
# makes no difference to a one-line redirect.
compatibility_date = "2026-07-06"
workers_dev = false
preview_urls = false
# Keep any variables set in the Cloudflare dashboard when deploying from here.
keep_vars = true

routes = [
  { pattern = "ejscreen.ejanalysis.com", custom_domain = true },
  { pattern = "ejscreenapp.ejanalysis.com", custom_domain = true },
]
