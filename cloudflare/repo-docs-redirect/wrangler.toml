# Cloudflare Worker "repo-docs-redirect". Read ../README.md before deploying.
name = "repo-docs-redirect"
main = "src/index.mjs"
compatibility_date = "2026-07-22"
workers_dev = false
preview_urls = false
# Keep any variables set in the Cloudflare dashboard when deploying from here.
keep_vars = true

routes = [
  { pattern = "apidocs-archive.ejanalysis.com", custom_domain = true },
  { pattern = "apidocs.ejanalysis.com", custom_domain = true },
  { pattern = "apirepo.ejanalysis.com", custom_domain = true },
  { pattern = "docs-archive.ejanalysis.com", custom_domain = true },
  { pattern = "docs.ejanalysis.com", custom_domain = true },
  { pattern = "ejamdata.ejanalysis.com", custom_domain = true },
  { pattern = "ejamdocs.ejanalysis.com", custom_domain = true },
  { pattern = "ejamrepo.ejanalysis.com", custom_domain = true },
  { pattern = "ejscreendocs-archive.ejanalysis.com", custom_domain = true },
  { pattern = "ejscreendocs.ejanalysis.com", custom_domain = true },
  { pattern = "ejscreenrepo.ejanalysis.com", custom_domain = true },
]
