# Cloudflare Worker "ejam-dev-redirect". Read ../README.md before deploying.
name = "ejam-dev-redirect"
main = "src/index.mjs"
# The live Worker has no compatibility date set; Wrangler needs one. It
# makes no difference to a one-line redirect.
compatibility_date = "2026-07-03"
workers_dev = false
preview_urls = false
# Keep any variables set in the Cloudflare dashboard when deploying from here.
keep_vars = true

routes = [
  { pattern = "dev.ejanalysis.com", custom_domain = true },
  { pattern = "ejamappdev.ejanalysis.com", custom_domain = true },
  { pattern = "ejamdev.ejanalysis.com", custom_domain = true },
]
