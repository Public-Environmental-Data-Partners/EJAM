# Cloudflare Worker "ejamapp". Read ../README.md before deploying.
name = "ejamapp"
main = "src/index.mjs"
compatibility_date = "2026-06-29"
workers_dev = false
preview_urls = false
# Keep any variables set in the Cloudflare dashboard when deploying from here.
keep_vars = true

routes = [
  { pattern = "ejam.ejanalysis.com", custom_domain = true },
  { pattern = "ejamapp.ejanalysis.com", custom_domain = true },
]

[observability]
enabled = true
head_sampling_rate = 1
