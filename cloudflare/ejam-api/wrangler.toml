# Cloudflare Worker "ejam-api". Read ../README.md before deploying.
name = "ejam-api"
main = "src/index.mjs"
compatibility_date = "2026-06-29"
workers_dev = false
preview_urls = false
# Keep any variables set in the Cloudflare dashboard when deploying from here.
keep_vars = true

routes = [
  { pattern = "api.ejanalysis.com", custom_domain = true },
  { pattern = "ejamapi.ejanalysis.com", custom_domain = true },
]

[observability]
enabled = true
head_sampling_rate = 1
