name: Build & Deploy to ECS Fargate (dev)

on:
  push:
    branches: [dev-deploy]
  workflow_dispatch:
    inputs:
      ejam_version:
        description: >-
          EJAM git ref to install & deploy to the DEV server: a branch
          (e.g. enter "development" to test the release candidate), a tag
          (e.g. v3.2022.2), or a commit SHA. Lets you test an unreleased
          branch on dev without cutting a tag. Leave blank (the default) to
          deploy the version pinned in the Dockerfile, same as a push does.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ejam           # shared with prod
  ECS_CLUSTER: ejam-dev-cluster
  ECS_SERVICE: ejam-dev-service
  ECS_TASK_FAMILY: ejam-dev
  CONTAINER_NAME: ejam
  APP_PORT: 2000

jobs:

  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: dev-${{ github.sha }}
          # Empty on a push (deploy the Dockerfile's pinned default); set only when a
          # manual "Run workflow" dispatch supplies a ref to override the pin with.
          # Passed via env (not inlined into the shell) to avoid command injection.
          EJAM_VERSION_INPUT: ${{ github.event.inputs.ejam_version }}
        run: |
          FULL_IMAGE=$REGISTRY/$ECR_REPOSITORY

          # Reminder: this DEV image runs the FULL (private) app, ejamapp(isPublic = FALSE),
          # so RC testing exercises every feature (ratio columns, etc.). PRODUCTION runs
          # isPublic = TRUE (the streamlined public app). If you want dev to mirror what
          # end users see, change isPublic in the Dockerfile CMD before deploying.
          echo "▶ App mode for this deploy: ejamapp(isPublic = FALSE)  [DEV = full/private app; prod = public]"

          # Override EJAM_VERSION only for a manual dispatch that named a ref; a plain
          # push (or a blank input) leaves it unset so the Dockerfile's pinned default
          # stays the single source of truth (no fallback duplicated here).
          # install_github accepts any ref — branch, tag, or SHA — so this can deploy
          # an unreleased branch to dev. The value is validated against git-ref
          # characters and passed as a single quoted array element, so it cannot be
          # word-split into extra docker flags (option injection).
          EXTRA_BUILD_ARGS=()
          if [ -n "$EJAM_VERSION_INPUT" ]; then
            if ! printf '%s' "$EJAM_VERSION_INPUT" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*$'; then
              echo "::error::ejam_version '$EJAM_VERSION_INPUT' is not a valid git ref (must start with a letter or digit; allowed characters: letters, digits, . _ / -)"
              exit 1
            fi
            echo "▶ Overriding EJAM_VERSION with dispatched ref: $EJAM_VERSION_INPUT"
            EXTRA_BUILD_ARGS=(--build-arg "EJAM_VERSION=$EJAM_VERSION_INPUT")
          else
            echo "▶ No ejam_version input; using the Dockerfile's pinned EJAM_VERSION default"
          fi

          # Use the auto-generated GITHUB_TOKEN for this workflow run (mirrors the R CI
          # workflows, e.g. check-standard.yaml `GITHUB_PAT: ${{ github.token }}`).
          # The token is short-lived and expires after the job; it's sufficient for
          # authenticated reads of public repos. Avoid using a stored PAT (EJAMDATA_PAT),
          # which can expire and cause HTTP 401 "Bad credentials" during the build.
          docker build \
            --build-arg GITHUB_PAT=${{ github.token }} \
            "${EXTRA_BUILD_ARGS[@]}" \
            -t $FULL_IMAGE:$IMAGE_TAG .

          docker push $FULL_IMAGE:$IMAGE_TAG

          echo "image=$FULL_IMAGE:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS
        env:
          NEW_IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail

          echo "▶ Fetching latest task definition for family: $ECS_TASK_FAMILY"
          LATEST_ARN=$(aws ecs list-task-definitions \
            --family-prefix "$ECS_TASK_FAMILY" \
            --sort DESC \
            --query 'taskDefinitionArns[0]' \
            --output text)

          if [[ "$LATEST_ARN" == "None" ]]; then
            echo "❌ No task definition found for family $ECS_TASK_FAMILY"
            echo "   Run 'terraform apply -var-file=dev.tfvars' in ejam-infra/ first."
            exit 1
          fi

          echo "▶ Current task definition: $LATEST_ARN"

          NEW_DEF=$(aws ecs describe-task-definition --task-definition "$LATEST_ARN" \
            | jq --arg IMG "$NEW_IMAGE" --arg NAME "$CONTAINER_NAME" \
              '.taskDefinition
               | .containerDefinitions = [.containerDefinitions[] | if .name == $NAME then .image = $IMG else . end]
               | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')

          echo "▶ Registering new task definition..."
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "▶ New task definition: $NEW_ARN"

          echo "▶ Updating ECS service..."
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_ARN" \
            --force-new-deployment

          echo "▶ Waiting for service to stabilize..."
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          echo "✅ Dev deployment complete"
