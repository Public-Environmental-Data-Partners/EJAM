
name: 'R CMD check'

on:
  # Runs where the risk actually is: PRs into main, and main itself - main is
  # what a release tag is cut from, and merges here are sometimes made with
  # --admin (which bypasses PR checks) or pushed directly as hotfixes, so the
  # post-merge run is the only thing that catches what a bypass skipped.
  #
  # Deliberately NOT run on PRs into development: this is a 6-configuration matrix
  # (macOS bills at 10x, Windows at 2x) on a package whose check takes ~12
  # minutes. development PRs get the cheap ubuntu gates (lintr, quick install)
  # instead. Revisit if breakage keeps reaching main.
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r == 'devel' && 'R-devel - development version of R' || matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,    r: 'release'}
          - {os: windows-latest,  r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}
          # 'minimum' is a label; the step below reads its version from DESCRIPTION.
          - {os: ubuntu-latest,   r: 'minimum'}

    env:
      GITHUB_PAT: ${{ github.token }}
      R_KEEP_PKG_SOURCE: yes
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      # Resolve only the 'minimum' row, before R is installed. Changing Depends:
      # R (>= ...) in DESCRIPTION automatically changes the R version tested here.
      - name: Read minimum R version from DESCRIPTION
        if: matrix.config.r == 'minimum'
        id: minimum-r
        run: python3 .github/scripts/minimum-r-version.py >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.minimum-r.outputs.version || matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: System libraries for Arrow/curl (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libcurl4-openssl-dev \
            libssl-dev \
            pkg-config

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Verify Arrow/curl dependencies
        run: source(".github/scripts/check-arrow-curl-deps.R")
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: false
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          # Fail the job only on an ERROR. The action's default is "warning",
          # which also fails on any WARNING - and this package currently emits
          # 12 of them, so the job could stay red even at 0 ERRORs and 0 NOTEs,
          # with the red telling you nothing about whether anything broke.
          #
          # WARNINGs and NOTEs are still reported: rcmdcheck prints every one in
          # the log and the "Status: N ERRORs, N WARNINGs, N NOTEs" summary is
          # always shown. They just no longer gate the build.
          #
          # Tighten this back to "warning" once those 12 warnings are dealt
          # with, so warnings cannot creep back in unnoticed.
          error-on: '"error"'

      - name: Explain R-devel failure
        if: ${{ failure() && matrix.config.r == 'devel' }}
        run: |
          echo "::warning title=R-devel check failed::This job uses the development version of R. See the R version results summary to find out whether released-R checks also failed."
          echo "### R-devel check failed" >> "$GITHUB_STEP_SUMMARY"
          echo "This job tests the development version of R. See the **R version results** summary for the released-R results." >> "$GITHUB_STEP_SUMMARY"

  R-version-results:
    name: R version results
    needs: R-CMD-check
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Summarize released-R and R-devel results
        uses: actions/github-script@v8
        with:
          script: |
            await require('./.github/scripts/summarize-r-checks.cjs').writeSummary({github, context, core});
