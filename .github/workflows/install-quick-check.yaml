name: 'Quick install check'

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]
  workflow_dispatch:
    inputs:
      install_source:
        description: 'What source should this quick check install?'
        required: true
        type: choice
        default: local
        options:
          - local
          - github-sha

permissions:
  contents: read

concurrency:
  group: install-quick-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-install:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    # Backstop only. The slowest observed SUCCESSFUL run took 23.5 minutes, so
    # this must stay clear of that; the per-step bounds below are what actually
    # catch a stall. See EJAM#585.
    timeout-minutes: 40

    env:
      GITHUB_PAT: ${{ github.token }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      EJAM_INSTALL_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      EJAM_INSTALL_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      INSTALL_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.install_source || 'github-sha' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        # Observed on successful runs: 0.5, 0.55, 1.3 and 11.2 minutes. That
        # 11.2 is real and it passed, so a tight bound here would manufacture
        # false failures -- 20 leaves nearly 2x headroom over the slowest
        # success while still catching a stall 3x sooner than the job timeout.
        timeout-minutes: 20
        with:
          r-version: release
          use-public-rspm: true

      - name: System libraries for Arrow/curl
        # Observed: 0.08 to 2.42 minutes.
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libcurl4-openssl-dev \
            libssl-dev \
            pkg-config

      - name: Install hard dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        # Observed: 1.35 to 3.6 minutes.
        timeout-minutes: 15
        with:
          dependencies: '"hard"'
          extra-packages: any::pak

      - name: Verify Arrow/curl dependencies
        run: source(".github/scripts/check-arrow-curl-deps.R")
        shell: Rscript {0}

      - name: Install EJAM
        run: |
          source <- Sys.getenv("INSTALL_SOURCE")
          repo <- Sys.getenv("EJAM_INSTALL_REPO")
          ref <- Sys.getenv("EJAM_INSTALL_REF")

          if (source == "local") {
            pak::local_install(".", dependencies = FALSE, upgrade = FALSE)
          } else if (source == "github-sha") {
            pak::pkg_install(
              sprintf("%s@%s", repo, ref),
              dependencies = NA,
              upgrade = FALSE
            )
          } else {
            stop("Unknown install source: ", source)
          }
        shell: Rscript {0}

      - name: Load EJAM
        run: |
          library(EJAM)
          message("Installed EJAM ", as.character(utils::packageVersion("EJAM")))
        shell: Rscript {0}
