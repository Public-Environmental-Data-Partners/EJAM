
name: 'Test web app UI and functionality'

on:
  # Expensive (macos-15, nine sequential shinytest2 app runs), so it stays
  # scoped to main: PRs into it, and main itself after a merge, since --admin
  # merges and direct hotfix pushes bypass the PR run.
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# system libraries:
#   libcurl -- needed to complete setup-renv
#   libharfbuzz-dev libfribidi-dev -- needed for the textshaping package
#   libudunits2-dev -- needed for package "units"
#   libgdal-dev -- needed for gdal config to configure package terra
# https://cran.r-project.org/web/packages/shinytest2/vignettes/use-ci.html

jobs:
  test:
    runs-on: macos-15
    if: ${{ !github.event.repository.private }}
    name: test-webapp-functionality

    strategy:
      fail-fast: false

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      GITHUB_PAT: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      NOT_CRAN: true
      SHINYTEST2_APP_DRIVER_TEST_ON_CRAN: 1
      # Every step below filters to a test-webapp-<category>-functionality.R
      # file, and those all call shinytest2_webapp_functionality_individual(),
      # which skips unless this is set. It never was, so all nine steps were
      # skipping and this workflow reported success while running no tests:
      #   "Individual web app category tests are skipped by default."
      # (verified in run 31042164366). Setting it makes them actually run.
      EJAM_SHINYTEST2_INDIVIDUAL: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Skip optional Suggests/Remotes such as AOI for this workflow.
          # The shiny UI tests only need EJAM's hard deps plus the test runners.
          dependencies: '"hard"'
          extra-packages: |
            any::pak
            any::shinytest2
            any::testthat

      - name: Verify Arrow/curl dependencies
        run: source(".github/scripts/check-arrow-curl-deps.R")
        shell: Rscript {0}

      # this ensures latest Pandoc is installed+used
      # setup-r-dependencies@v2 will try to install pandoc from Ubuntu repo, which might be older
      - name: Install Latest Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      # Check which Pandoc version is being used and its path
      - name: Verify Pandoc Version
        run: |
          which pandoc
          pandoc --version

      - name: Install GitHub CLI
        run: brew install gh

      - name: Install EJAM Package
        run: |
          pak::local_install(".", dependencies = FALSE, upgrade = FALSE)
        shell: Rscript {0}

      - name: Load EJAM Package
        run: |
          require(EJAM)
        shell: Rscript {0}

      - name: Load testthat and shinytest2 packages
        run: |
          require(shinytest2)
          require(testthat)
          # require(golem) # might not be essential
        shell: Rscript {0}

################## #

## note also could just do shinytest2::test_app(".", filter="-functionality", check_setup = FALSE)

      - name: FIPS-picker UI test
        run: |
          shinytest2::test_app(".", filter="FIPS-picker-functionality", check_setup = FALSE)
        shell: Rscript {0}

      - name: FIPS UI test
        run: |
          shinytest2::test_app(".", filter="FIPS-functionality", check_setup = FALSE)
        shell: Rscript {0}

      - name: FRS UI test
        run: |
          shinytest2::test_app(".", filter="FRS-functionality", check_setup = FALSE)
        shell: Rscript {0}

      - name: latlon UI test
        run: |
          shinytest2::test_app(".", filter="latlon-functionality", check_setup = FALSE)
        shell: Rscript {0}

      - name: NAICS UI test
        run: |
          shinytest2::test_app(".", filter="NAICS-functionality", check_setup = FALSE)
        shell: Rscript {0}

      - name: shp-gdb-zip UI test
        run: |
          shinytest2::test_app(".", filter="shp-gdb-zip-functionality", check_setup = FALSE)
        shell: Rscript {0}

      - name: shp-json UI test
        run: |
          shinytest2::test_app(".", filter="shp-json-functionality", check_setup = FALSE)
        shell: Rscript {0}

      - name: shp-unzip UI test
        run: |
          shinytest2::test_app(".", filter="shp-unzip-functionality", check_setup = FALSE)
        shell: Rscript {0}

      - name: shp-zip UI test
        run: |
          shinytest2::test_app(".", filter="shp-zip-functionality", check_setup = FALSE)
        shell: Rscript {0}

################## #

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-tests
          path: |
            tests
            EJAM_app_test_log_pre_results_download.txt
