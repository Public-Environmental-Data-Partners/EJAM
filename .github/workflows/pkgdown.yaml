
name: 'build and deploy documentation website on github pages'

on:
  # development push          -> /dev/
  # release published, Latest -> the docs ROOT
  # release published, not    -> nothing (see the gate in "Configure deployment")
  # workflow_dispatch         -> anywhere, manual override
  #
  # Pushing main never deploys: main changes only at releases and hotfixes, and
  # hotfixes get a patch release, so the release event covers it without ever
  # publishing docs for an unreleased state.
  push:
    branches: [ "development" ]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Optional branch, tag, or SHA to build'
        required: false
        type: string
      target_folder:
        description: 'Optional folder on gh-pages, e.g. dev or v2.5.0'
        required: false
        type: string
      pkgdown_dev_mode:
        description: 'pkgdown mode; auto infers release except for dev'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - release
          - devel

permissions: read-all

# GitHub Pages should be configured to publish from the root of the gh-pages
# branch. Source branches should not commit generated pkgdown HTML.

# This Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help

jobs:
  build-deploy-pkgdown:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: pkgdown-gh-pages
      cancel-in-progress: false
    env:
      GITHUB_PAT: ${{ github.token }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - name: Configure deployment
        id: deploy
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_TARGET_FOLDER: ${{ inputs.target_folder }}
          INPUT_PKGDOWN_DEV_MODE: ${{ inputs.pkgdown_dev_mode }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          build_ref="${INPUT_REF:-$GITHUB_REF}"
          ref_name="$GITHUB_REF_NAME"
          if [ -n "$INPUT_REF" ]; then
            ref_name="${INPUT_REF#refs/heads/}"
            ref_name="${ref_name#refs/tags/}"
          fi

          # A manual workflow_dispatch target always wins, so the root or any
          # folder can still be rebuilt by hand.
          target_folder="$INPUT_TARGET_FOLDER"
          skip=false
          if [ -z "$target_folder" ]; then
            if [ -n "$RELEASE_TAG" ]; then
              # A published release updates the ROOT docs site, but only when it
              # is the release GitHub marks "Latest".
              #
              # This matters because EJAM keeps parallel annual-vintage lines
              # (v3.2022.x, v3.2023.x, v3.2024.x), so the highest version number
              # is NOT the recommended one - v3.2022.x is, while v3.2024.0
              # exists. Publishing a 2023 or 2024 release must not overwrite the
              # root site with docs for a line users are not being pointed at.
              # The "Latest" flag is curated by hand and already encodes
              # "recommended", so it is exactly the right gate.
              # Retry: this fires immediately on the release event, and the
              # /releases/latest endpoint can lag a moment behind publication.
              # Without this, a correct release could be misread as "not Latest"
              # and silently skip the root deploy - the exact unattended failure
              # this gate is supposed to prevent.
              latest_tag=''
              for attempt in 1 2 3 4 5; do
                latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || echo '')"
                [ "$latest_tag" = "$RELEASE_TAG" ] && break
                echo "attempt $attempt: Latest reads '${latest_tag:-unknown}', expected '$RELEASE_TAG'; retrying"
                sleep 10
              done
              if [ -n "$latest_tag" ] && [ "$latest_tag" = "$RELEASE_TAG" ]; then
                target_folder="."
                echo "::notice::$RELEASE_TAG is the Latest release - deploying to the docs root."
              else
                skip=true
                echo "::notice::$RELEASE_TAG is not the Latest release (Latest is '${latest_tag:-unknown}'). Leaving the docs root untouched. Rebuild by hand with workflow_dispatch if that is wrong."
              fi
            elif [ "$ref_name" = "development" ]; then
              target_folder="dev"
            elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
              target_folder="$GITHUB_REF_NAME"
            else
              target_folder="."
            fi
          fi

          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = "true" ]; then
            # Nothing further should run, but the remaining steps need a value.
            target_folder="."
          fi

          pkgdown_dev_mode="$INPUT_PKGDOWN_DEV_MODE"
          if [ -z "$pkgdown_dev_mode" ] || [ "$pkgdown_dev_mode" = "auto" ]; then
            if [ "$target_folder" = "dev" ]; then
              pkgdown_dev_mode="devel"
            else
              pkgdown_dev_mode="release"
            fi
          fi

          build_dir="docs"
          if [ "$pkgdown_dev_mode" = "devel" ]; then
            build_dir="docs/dev"
          fi

          # Versioned base URL so internal links + url_package() resolve within the
          # version/subfolder being built (root, /dev/, /v3.2024.0/, etc.).
          root_url="https://public-environmental-data-partners.github.io/EJAM"
          case "$target_folder" in
            "."|"") base_url="$root_url" ;;
            *) base_url="$root_url/$target_folder" ;;
          esac

          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"
          echo "build_ref=$build_ref" >> "$GITHUB_OUTPUT"
          echo "target_folder=$target_folder" >> "$GITHUB_OUTPUT"
          echo "pkgdown_dev_mode=$pkgdown_dev_mode" >> "$GITHUB_OUTPUT"
          echo "build_dir=$build_dir" >> "$GITHUB_OUTPUT"
          echo "Building $build_ref as $pkgdown_dev_mode; deploying $build_dir to gh-pages/$target_folder"

      - uses: actions/checkout@v7
        if: steps.deploy.outputs.skip != 'true'
        with:
          ref: ${{ steps.deploy.outputs.build_ref }}

      - uses: r-lib/actions/setup-pandoc@v2
        if: steps.deploy.outputs.skip != 'true'

      - uses: r-lib/actions/setup-r@v2
        if: steps.deploy.outputs.skip != 'true'
        with:
          use-public-rspm: true

      - name: System libraries for Arrow/curl
        if: steps.deploy.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libcurl4-openssl-dev \
            libssl-dev \
            pkg-config

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.deploy.outputs.skip != 'true'
        with:
          extra-packages: any::pkgdown, local::.
          # Install only hard deps (+ pkgdown) for the docs build. Avoids building
          # optional Suggests like the GitHub-only `AOI` package, which fails to
          # build in CI ("lazy loading failed for package 'AOI' / object '%>%' not
          # found") and was breaking every pkgdown deploy. The docs don't need
          # Suggests (EJAM vignettes are eval=FALSE; AOI examples are \dontrun).
          dependencies: '"hard"'
          needs: website

      - name: Verify Arrow/curl dependencies
        if: steps.deploy.outputs.skip != 'true'
        run: source(".github/scripts/check-arrow-curl-deps.R")
        shell: Rscript {0}

      - name: Build site
        if: steps.deploy.outputs.skip != 'true'
        # Do specific steps here to avoid build_llm_docs(), which is slow for
        # this large site and not currently part of the publishing contract.
        env:
          PKGDOWN_DEV_MODE: ${{ steps.deploy.outputs.pkgdown_dev_mode }}
          EJAM_DOCS_BASE_URL: ${{ steps.deploy.outputs.base_url }}
        run: |
          dev_mode <- Sys.getenv("PKGDOWN_DEV_MODE")
          base_url <- Sys.getenv("EJAM_DOCS_BASE_URL")
          # For release/version/root builds, pin pkgdown's url to the versioned base so
          # internal absolute links resolve within the version. In devel mode let pkgdown
          # add the /dev subpath itself (avoid doubling it); EJAM_DOCS_BASE_URL stays set
          # so url_package() in rendered examples still points within /dev/.
          if (nzchar(base_url) && !identical(dev_mode, "devel")) {
            pkg <- pkgdown::as_pkgdown(".", override = list(url = base_url))
          } else {
            pkg <- pkgdown::as_pkgdown(".")
          }
          pkgdown::init_site(pkg)
          pkgdown::build_favicons(pkg)
          pkgdown::build_home(pkg)
          # examples = FALSE: don't execute every function's @examples during the
          # docs deploy. EJAM examples download the large ejamdata arrow data and
          # run analyses, making the build extremely slow and fragile in CI. The
          # reference pages still show the example code; example correctness is
          # covered by R CMD check, not the docs deploy.
          pkgdown::build_reference(pkg, examples = FALSE)
          pkgdown::build_articles(pkg)
          pkgdown::build_tutorials(pkg)
          pkgdown::build_news(pkg)
          pkgdown:::build_sitemap(pkg)
          pkgdown::build_redirects(pkg)
          pkgdown::build_search(pkg)
          pkgdown:::check_built_site(pkg)

        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: steps.deploy.outputs.skip != 'true'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          clean: true
          clean-exclude: |
            dev/**
            v*/**
            .nojekyll
          folder: ${{ steps.deploy.outputs.build_dir }}
          branch: gh-pages
          target-folder: ${{ steps.deploy.outputs.target_folder }}
          force: false
          attempt-limit: 5
