
name: 'build and deploy documentation website on github pages'

on:
  push:
    branches: [ "main", "development" ]
    tags: [ "v*" ]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Optional branch, tag, or SHA to build'
        required: false
        type: string
      target_folder:
        description: 'Optional folder on gh-pages, e.g. dev or v2.5.0'
        required: false
        type: string
      pkgdown_dev_mode:
        description: 'pkgdown mode; auto infers release except for dev'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - release
          - devel

permissions: read-all

# GitHub Pages should be configured to publish from the root of the gh-pages
# branch. Source branches should not commit generated pkgdown HTML.

# This Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help

jobs:
  build-deploy-pkgdown:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: pkgdown-gh-pages
      cancel-in-progress: false
    env:
      GITHUB_PAT: ${{ github.token }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - name: Configure deployment
        id: deploy
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_TARGET_FOLDER: ${{ inputs.target_folder }}
          INPUT_PKGDOWN_DEV_MODE: ${{ inputs.pkgdown_dev_mode }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          build_ref="${INPUT_REF:-$GITHUB_REF}"
          ref_name="$GITHUB_REF_NAME"
          if [ -n "$INPUT_REF" ]; then
            ref_name="${INPUT_REF#refs/heads/}"
            ref_name="${ref_name#refs/tags/}"
          fi

          target_folder="$INPUT_TARGET_FOLDER"
          if [ -z "$target_folder" ]; then
            if [ -n "$RELEASE_TAG" ]; then
              target_folder="$RELEASE_TAG"
            elif [ "$ref_name" = "development" ]; then
              target_folder="dev"
            elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
              target_folder="$GITHUB_REF_NAME"
            else
              target_folder="."
            fi
          fi

          pkgdown_dev_mode="$INPUT_PKGDOWN_DEV_MODE"
          if [ -z "$pkgdown_dev_mode" ] || [ "$pkgdown_dev_mode" = "auto" ]; then
            if [ "$target_folder" = "dev" ]; then
              pkgdown_dev_mode="devel"
            else
              pkgdown_dev_mode="release"
            fi
          fi

          build_dir="docs"
          if [ "$pkgdown_dev_mode" = "devel" ]; then
            build_dir="docs/dev"
          fi

          echo "build_ref=$build_ref" >> "$GITHUB_OUTPUT"
          echo "target_folder=$target_folder" >> "$GITHUB_OUTPUT"
          echo "pkgdown_dev_mode=$pkgdown_dev_mode" >> "$GITHUB_OUTPUT"
          echo "build_dir=$build_dir" >> "$GITHUB_OUTPUT"
          echo "Building $build_ref as $pkgdown_dev_mode; deploying $build_dir to gh-pages/$target_folder"

      - uses: actions/checkout@v4.3.0
        with:
          ref: ${{ steps.deploy.outputs.build_ref }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        # Do specific steps here to avoid build_llm_docs(), which is slow for
        # this large site and not currently part of the publishing contract.
        env:
          PKGDOWN_DEV_MODE: ${{ steps.deploy.outputs.pkgdown_dev_mode }}
        run: |
          pkg <- pkgdown::as_pkgdown(".")
          pkgdown::init_site(pkg)
          pkgdown::build_favicons(pkg)
          pkgdown::build_home(pkg)
          pkgdown::build_reference(pkg)
          pkgdown::build_articles(pkg)
          pkgdown::build_tutorials(pkg)
          pkgdown::build_news(pkg)
          pkgdown:::build_sitemap(pkg)
          pkgdown::build_redirects(pkg)
          pkgdown::build_search(pkg)
          pkgdown:::check_built_site(pkg)

        shell: Rscript {0}

      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          clean: true
          clean-exclude: |
            dev/**
            v*/**
            .nojekyll
          folder: ${{ steps.deploy.outputs.build_dir }}
          branch: gh-pages
          target-folder: ${{ steps.deploy.outputs.target_folder }}
          force: false
          attempt-limit: 5
