name: 'Debug web app FRS only'

on:
  push:
    branches: [ "development" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-webapp-frs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frs:
    runs-on: macos-15
    if: ${{ !github.event.repository.private }}
    name: debug-webapp-FRS
    timeout-minutes: 60

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      GH_TOKEN: ${{ github.token }}
      NOT_CRAN: true
      SHINYTEST2_APP_DRIVER_TEST_ON_CRAN: 1
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4.3.0

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pak
            any::shinytest2
            any::testthat

      - name: Install Latest Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Verify Pandoc Version
        run: |
          which pandoc
          pandoc --version

      - name: Install EJAM Package
        run: |
          pak::local_install(".", dependencies = FALSE, upgrade = FALSE)
        shell: Rscript {0}

      - name: Load EJAM Package
        run: |
          require(EJAM)
        shell: Rscript {0}

      - name: Load testthat and shinytest2 packages
        run: |
          require(shinytest2)
          require(testthat)
        shell: Rscript {0}

      - name: FRS UI test
        run: |
          shinytest2::test_app(".", filter="FRS-functionality", check_setup = FALSE)
        shell: Rscript {0}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-webapp-FRS-tests
          path: |
            tests
            EJAM_app_test_log_pre_results_download.txt
