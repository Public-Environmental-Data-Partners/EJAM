
name: 'lintr checks code style and syntax errors'

on:
  # Cheap (single ubuntu job), so run it broadly - this is the fast feedback
  # that development PRs currently get none of.
  pull_request:
    branches: [ "main", "development" ]
  push:
    branches: [ "main", "development" ]
  workflow_dispatch:

# lintr provides static code analysis for R.
# It checks for adherence to a given style,
# identifying syntax errors and possible semantic issues,
# then reports them to you so you can take action.
# More details at https://lintr.r-lib.org/
#
# ## to use just a subset of the most important checks:
## see  EJAM/R/utils_lint_trailing_spaces.R
#  mine = c(
#     linters_with_tags('common_mistakes'),
#     list( # correctness minus object usage
#       duplicate_argument_linter(),
#       equals_na_linter(),
#       missing_argument_linter(),
#       namespace_linter(),
#       package_hooks_linter(),
#       sprintf_linter()
#     )
#   )
#   # ### but not "object_usage_linter"

permissions:
  contents: read

jobs:
  lintr:
    name: Run lintr scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:

      - name: Checkout EJAM code
        uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Setup lintr
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: false
          extra-packages: lintr

      - name: Run lintr
        # Which linters run is set by the .lintr file at the root of the repo,
        # which lint_dir() picks up. See the comments in that file.
        run: lintr::sarif_output(lintr::lint_dir("."), "lintr-results.sarif")
        shell: Rscript {0}
        continue-on-error: true

      # lintr can report a lint at column 0 (indentation_linter does this for a
      # line that should be indented but is not), and SARIF requires
      # startColumn >= 1. One out-of-range value makes GitHub reject the whole
      # file, so every result is lost - that is what used to fail this job. The
      # .lintr file does not enable any linter that does this today; this step
      # just keeps one stray lint from taking the whole upload down again.
      - name: Fix out-of-range columns in the SARIF file
        run: |
          # "Run lintr" is continue-on-error, so it can go green having written
          # nothing. Say so plainly rather than letting jq (and then the upload)
          # fail with something that reads like a problem with this step.
          if [ ! -f lintr-results.sarif ]; then
            echo "::error::lintr produced no lintr-results.sarif - check the 'Run lintr' step above for the R error."
            exit 1
          fi
          # select(type == "number") so a non-numeric column, should one ever
          # appear, is passed through untouched instead of being compared.
          jq '(.. | objects | select(has("startColumn")) | .startColumn | select(type == "number")) |= (if . < 1 then 1 else . end)
              | (.. | objects | select(has("endColumn"))   | .endColumn   | select(type == "number")) |= (if . < 1 then 1 else . end)' \
            lintr-results.sarif > lintr-results.fixed.sarif
          mv lintr-results.fixed.sarif lintr-results.sarif

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: lintr-results.sarif
          wait-for-processing: true
